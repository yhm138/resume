name: metrics

on:
  schedule:
    - cron: "7 * * * *"       # hourly; the job only commits when a value actually changes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stack Exchange 全站声誉、RosettaCode 贡献页、chrome-stats 都需要真实浏览器上下文。
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Scrape
        run: python metrics.py --out metrics.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh metrics"
            git push
          fi
