name: metrics

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stack Exchange 全站声誉、RosettaCode 贡献页、chrome-stats 都需要真实浏览器上下文。
      # 浏览器只是加分项：装不上就用不了 SE 全站与 chrome-stats，其余四项照常出数。
      - name: Install Playwright (best effort)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps --only-shell chromium

      # 每个源都有 primary 与可选的 fallback；两个都失败时保留上一次的值并累加 fail_streak。
      - name: Scrape
        run: python metrics.py --out metrics.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh metrics"
            git push
          fi

      # L1：连续 3 次抓取失败的源，开一条 issue 并持续追加，失败恢复后自动关闭。
      - name: Alert on repeated failures
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="metrics: a data source is failing"

          over=$(jq -r '(.fail_streak // {}) | to_entries[]
                        | select(.value >= 3)
                        | "- `\(.key)` — \(.value) consecutive failures"' metrics.json || true)

          existing=$(gh issue list --repo "$REPO" --state open \
                       --search "in:title \"$TITLE\"" --json number \
                       --jq '.[0].number // empty')

          if [ -z "$over" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$REPO" \
                --comment "All sources are reaching their upstream again. Closing."
            fi
            echo "no failing sources"
            exit 0
          fi

          BODY=$(printf 'These sources failed three runs in a row. The page keeps showing the last good value, so nothing breaks — but the number is now stale.\n\n%s\n\nCheck `sources` and `fail_streak` in `metrics.json`; the fallback path (if any) already ran before this alert fired.\n' "$over")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi
