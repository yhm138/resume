name: metrics

on:
  schedule:
    - cron: "17 3 1 * *"      # 03:17 UTC, 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 四个来源都是普通 HTTPS，不需要浏览器，也不需要第三方依赖：
      # GitHub API / GreasyFork API / pypistats / RosettaCode MediaWiki API。
      - name: Scrape
        run: python metrics.py --out metrics.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh metrics"
            git push
          fi
